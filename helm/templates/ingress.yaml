apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ng-events-web
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.apiPrefix }}
            pathType: Prefix
            backend:
              service:
                name: events-frontend-service
                port:
                  number: {{ .Values.service.port }}